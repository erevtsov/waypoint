[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waypoint"
version = "0.1.0"
description = "A financial portfolio advisor library for returns-based time series analysis"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "erevtsov" }]
requires-python = ">=3.12"
keywords = ["finance", "portfolio", "time-series", "returns", "analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "cvxpy>=1.9.3",
    "numpy>=2.5.3",
    "plotly>=7.1",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2"]
fred     = ["fredapi>=0.5"]
eodhd    = ["eodhd>=1.0"]
data     = ["waypoint[yfinance,fred,eodhd]"]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1",
    "hypothesis>=6.168.3",
]
lint = [
    "ruff>=0.16.10",
]
typecheck = [
    "mypy>=2.4",
]
notebook = [
    "ipykernel>=6.0",
    "jupyter>=1.0",
]
dev = [
    "waypoint[data,test,lint,typecheck,notebook]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/waypoint"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["waypoint"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["waypoint"]

[[tool.mypy.overrides]]
module = ["yfinance", "fredapi", "eodhd", "cvxpy", "plotly", "plotly.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=waypoint",
    "--cov-report=term-missing",
    "-v",
]

[tool.coverage.run]
source = ["src/waypoint"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
